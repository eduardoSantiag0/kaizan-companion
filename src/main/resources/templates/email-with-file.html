
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen Companion — Analysis Complete</title>
</head>

<body style="
    margin: 0;
    padding: 40px 16px;
    background-color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #222222;
">

<table role="presentation" align="center" cellpadding="0" cellspacing="0"
       style="
           width: 100%;
           max-width: 560px;
           background-color: #ffffff;
           border: 1px solid #e8e8e8;
           border-radius: 12px;
       ">

    <tr>
        <td style="padding: 36px 40px;">

            <!-- Banner -->
            <div style="text-align: center; margin-bottom: 32px;">
                <img src= "banner-email.png"
                     th:src="|cid:springLogo|"
                     alt="Kaizen Companion"
                     style="max-width: 100%; height: auto;"
                     width="1000">
            </div>

            <h1 style="
                margin: 0 0 16px;
                font-size: 26px;
                font-weight: 700;
                letter-spacing: -0.5px;
                color: #171717;
            ">
                Your match has been analysed!
            </h1>

            <p style="
                font-size: 15px;
                line-height: 1.7;
                margin: 0 0 12px;
            ">
                Hey, <strong th:text="${username}">Username</strong>!
            </p>

            <!-- Message -->
            <p style="
                font-size: 15px;
                line-height: 1.7;
                color: #555555;
                margin: 0 0 24px;
            ">
                The Go match <strong th:text="${players}">Black vs White </strong> analysis is complete.
                <br>
                Your SGF files are attached
            </p>

        </td>
    </tr>
</table>

<!-- Footer -->
<p style="
    text-align: center;
    font-size: 12px;
    color: #999999;
    margin-top: 24px;
    line-height: 1.6;
">
    ⛩ KAIZEN COMPANION
    <br>
</p>

</body>
</html>
