spring.application.name=kaizan-companion
#--spring.profiles.active=prod
spring.profiles.active=dev


telegram.bot.name=botforgo_bot
telegram.bot.token=${BOT_TOKEN}

telegram.bot.api = https://api.telegram.org/bot${BOT_TOKEN}

ogs.baseurl = https://online-go.com/api/v1/


DB_NAME=kaizan-db2
#spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

hibernate.dialect=org.hibernate.dialect.HSQLDialect

#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.format-sql=true

server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver

spring.devtools.restart.enabled = false
logging.level.io.github.eduardosantiag0=DEBUG

storage.provider=${STORAGE_PROVIDER:local}
file.upload-dir=${FILE_UPLOAD_DIR:tmp}

#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=admin
#spring.rabbitmq.password=admin

rabbitmq.exchange.analysis.exchange = analysis.exchange
rabbitmq.exchange.analysis.queue = analysis.queue
rabbitmq.exchange.analysis.dlq = analysis.dql
rabbitmq.exchange.analysis.routing-key = analysis.rounding-key

katago.runpod.api=${RUNPOD_API}
katago.runpod.port= 8970
