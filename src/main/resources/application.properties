spring.application.name=kaizan-companion
#--spring.profiles.active=prod
spring.profiles.active=dev


telegram.bot.name=botforgo_bot
telegram.bot.token=${BOT_TOKEN}

telegram.bot.api = https://api.telegram.org/bot${BOT_TOKEN}

ogs.baseurl = https://online-go.com/api/v1/
dgs.baseurl=https://dragongoserver.net/

DB_NAME=kaizan-db2
#spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

hibernate.dialect=org.hibernate.dialect.HSQLDialect

spring.jpa.show-sql=true
spring.jpa.format-sql=true

server.port=8080
spring.datasource.driver-class-name=org.postgresql.Driver

spring.devtools.restart.enabled = false
logging.level.io.github.eduardosantiag0=DEBUG

storage.provider=${STORAGE_PROVIDER:local}
file.upload-dir=${FILE_UPLOAD_DIR:tmp}

#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=admin
#spring.rabbitmq.password=admin

rabbitmq.exchange.analysis.exchange = kaizen.exchange
rabbitmq.exchange.analysis.routing-key = analysis.created

rabbitmq.queue.analysis = analysis.queue
rabbitmq.queue.analysis.dlq = analysis.dql
rabbitmq.queue.external.email=email.queue
rabbitmq.queue.external.email.routing-key=email.send
rabbitmq.queue.external.drive=drive.queue
rabbitmq.queue.external.drive.routing-key=analysis.upload

rabbitmq.dlq.exchange=analysis.dlx
rabbitmq.dlq.routing-key=analysis.failed

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
job.retry.max = 5

katago.runpod.api=${RUNPOD_API}
katago.runpod.port = 8970
katago.runpod.status.port = 8971

spring.threads.virtual.enabled=true

spring.flyway.locations = classpath:db/migration

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SENDER_MAIL_ADDRESS}
spring.mail.password=${SENDER_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_DRIVE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_DRIVE_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,https://www.googleapis.com/auth/drive.file

server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Força o Google a entregar o Refresh Token
#spring.security.oauth2.client.provider.google.authorization-uri=https://google.com

app.security.encryption-key=${ENCRYPTION_KEY}
